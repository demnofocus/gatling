name: Gatling Performance Test

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Enter name of test project to run'
        required: true
        default: 'java-maven'
      simulation:
        description: 'Enter name of the simulation'
        required: true
        default: 'LoadTest'
      ramp_up_duration:
        description: 'Load ramp up duration'
        default: '2'
      test_duration:
        description: 'Load duration (steady load)'
        required: true
        default: '2'


jobs:
  gatling-tests:
    name: ${{ github.event.inputs.project }}_perf_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This is the key: call the composite action in the chosen project folder
      - name: Run project action
        uses: ./${{ github.event.inputs.project }}/actions
        with:
          simulation: ${{ github.event.inputs.simulation }}
          test_duration: ${{ github.event.inputs.test_duration }}
          ramp_up_duration: ${{ github.event.inputs.ramp_up_duration }}