name: "Run Gatling (JavaScript)"
description: "Runs Gatling tests for the JS project"

inputs:
  simulation:
    required: true
  test_duration:
    required: true
  ramp_up_duration:
    required: true
  secret_id:
    required: false
  secret_key:
    required: false

runs:
  using: "composite"
  steps:

    - name: Run Gatling Tests
      shell: bash
      run: |
        ./javascript/actions/run-gatling.sh \
        ${{ inputs.simulation }} \
        ${{ inputs.test_duration }} \
        ${{ inputs.ramp_up_duration }} \
        ${{ github.workspace }} \
        ${{ inputs.secret_id }} \
        ${{ inputs.secret_key }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gatling-reports-java-maven-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/java-maven/target/gatling/**
        if-no-files-found: warn